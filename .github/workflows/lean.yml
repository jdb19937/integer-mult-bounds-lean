name: Lean
on: [push, pull_request]
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # Restore and save the build cache ourselves so finished modules are kept even when the
      # build fails, times out or is cancelled; the next run continues from there.
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      # Heavy kernel checks running side by side can exceed the runner's 16 GB. With swap the
      # runner slows down instead of dying, so the build either finishes or times out and the
      # cache save below still runs.
      - run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile-ci || sudo fallocate -l 16G /swapfile-ci
          f=$(ls /mnt/swapfile-ci /swapfile-ci 2>/dev/null | head -1)
          sudo chmod 600 "$f"
          sudo mkswap "$f"
          sudo swapon "$f"
          free -g
      - uses: leanprover/lean-action@v1
        timeout-minutes: 55
        with:
          use-github-cache: false
      # A timed-out build can leave Lean processes writing into .lake; stop them so the archive is consistent.
      - if: always()
        run: |
          pkill -x lake || true
          pkill -x lean || true
          sleep 5
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - run: lake env lean AxiomAudit.lean
      - run: lake env lean MathlibTM2Check.lean
      - run: lake env lean FastPathCheck.lean
      - run: lake env lean CompletedProofCheck.lean
      - run: lake env lean CompactControlCheck.lean
