name: Lean
on: [push, pull_request]
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # Restore and save the build cache ourselves so finished modules are kept even when the
      # build fails, times out or is cancelled; the next run continues from there.
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      # Extra swap absorbs short memory spikes between the guard's samples.
      - run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false
          test: false
          lint: false
      # The guard stops the build before the runner runs out of memory, so the cache save
      # below still runs. Lake resumes from the finished modules on each retry.
      - timeout-minutes: 55
        run: |
          for attempt in 1 2 3 4 5; do
            status=0
            python3 scripts/build-lean-guarded.py --budget-gib 14 || status=$?
            [ "$status" -ne 137 ] && exit "$status"
            echo "Build stopped by the memory guard; retrying (attempt $attempt)."
          done
          exit 137
      # A timed-out build can leave Lean processes writing into .lake; stop them so the archive is consistent.
      - if: always()
        run: |
          pkill -x lake || true
          pkill -x lean || true
          sleep 5
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - run: lake env lean AxiomAudit.lean
      - run: lake env lean MathlibTM2Check.lean
      - run: lake env lean FastPathCheck.lean
      - run: lake env lean CompletedProofCheck.lean
      - run: lake env lean CompactControlCheck.lean
